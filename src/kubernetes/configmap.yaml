apiVersion: v1
kind: ConfigMap
metadata:
  name: cinemaabyss-config
  namespace: cinemaabyss
data:
  # Database configuration
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "cinemaabyss"
  DB_USER: "postgres"

  #kafka configuration
  KAFKA_HOST: "kafka"
  KAFKA_PORT: "9092"

  # Service URLs
  MONOLITH_URL: "monolith:8080"
  MOVIES_SERVICE_URL: "movies-service:8081"
  
  # Strangler Fig configuration
  GRADUAL_MIGRATION: "true"
  MOVIES_MIGRATION_PERCENT: "100"
